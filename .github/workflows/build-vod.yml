name: Build Vod

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm-cache
  NDK_VERSION: 29.0.14206865

jobs:
  loader:
    name: Loader (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: android64
            abi: arm64-v8a
          - id: android32
            abi: armeabi-v7a
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"
          echo "NDK=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Ninja
        uses: ./.github/actions/setup-ninja
        with:
          host: linux

      - name: Setup Geode CLI (used only to package loader resources)
        uses: geode-sdk/cli/.github/actions/setup@main

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DGEODE_CODEGEN_CMAKE_ARGS="-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja"
          -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DANDROID_PLATFORM=android-23
          -DANDROID_STL=c++_shared
          -DANDROID_ABI=${{ matrix.abi }}
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Strip
        run: $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip ./bin/nightly/Geode.${{ matrix.id }}.so

      - uses: actions/upload-artifact@v4
        with:
          name: vod-loader-${{ matrix.id }}
          path: ./bin/nightly

  apk:
    name: Vod launcher APK
    needs: loader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1"

      - uses: actions/download-artifact@v4
        with:
          name: vod-loader-android64
          path: dl64
      - uses: actions/download-artifact@v4
        with:
          name: vod-loader-android32
          path: dl32

      - name: Bundle loader into the launcher
        run: |
          J=launcher/app/src/main/jniLibs
          mkdir -p $J/arm64-v8a $J/armeabi-v7a launcher/app/src/main/assets/geode-resources
          cp dl64/Geode.android64.so $J/arm64-v8a/libGeode.android64.so
          cp dl32/Geode.android32.so $J/armeabi-v7a/libGeode.android32.so
          cp dl64/resources/* launcher/app/src/main/assets/geode-resources/

      - name: Build APK
        working-directory: launcher
        run: gradle --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp launcher/app/build/outputs/apk/release/app-release.apk out/Vod-Launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Vod-Launcher
          path: out/Vod-Launcher.apk
